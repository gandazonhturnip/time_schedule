<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'self' file: https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Daftar Tugas</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <main class="container app-shell py-5">
    <header class="mb-4">
      <h1 class="h2 fw-bold mb-1">Daftar Tugas</h1>
      <p class="text-secondary mb-0" id="summary" aria-live="polite"></p>
    </header>

    <section class="card app-card shadow-sm">
      <div class="card-body">
        <form id="task-form" novalidate>
          <label for="task-input" class="visually-hidden">Tugas baru</label>
          <div class="input-group has-validation">
            <input id="task-input" type="text" class="form-control form-control-lg"
                   maxlength="120" autocomplete="off" placeholder="Tulis tugas berikutnya">
            <button class="btn btn-primary px-4" type="submit">Tambah</button>
            <div class="invalid-feedback" id="task-error"></div>
          </div>
          <div class="d-flex align-items-center gap-2 mt-2">
            <label for="due-input" class="small text-secondary mb-0">Tenggat (opsional)</label>
            <input id="due-input" type="datetime-local" class="form-control form-control-sm due-input">
          </div>
        </form>

        <div class="btn-group w-100 mt-3" role="group" aria-label="Filter tugas" id="filters">
          <button type="button" class="btn btn-outline-secondary" data-filter="all">Semua</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="active">Belum selesai</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="done">Selesai</button>
        </div>
      </div>

      <ul class="list-group list-group-flush" id="task-list"></ul>

      <p class="text-center text-secondary py-4 mb-0" id="empty-state" hidden></p>

      <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
        <span class="small text-secondary" id="counter"></span>
        <button type="button" class="btn btn-sm btn-outline-danger" id="clear-done">Hapus yang selesai</button>
      </div>
    </section>
  </main>
</body>
</html>
